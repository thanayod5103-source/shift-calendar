<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f6f91">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Shift Calendar</title>
<style>html,body{margin:0;width:100%;height:100%;background:#e7ebf0}body{overflow:hidden}iframe{display:block;width:100%;height:100%;height:100dvh;border:0}</style>
</head>
<body>
<iframe id="calendarFrame" src="./calendar.html" title="Shift Calendar"></iframe>
<script>
(function(){
  const frame=document.getElementById('calendarFrame');
  let applied=false;
  function todayInBangkok(){
    const fmt=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Bangkok',calendar:'gregory',year:'numeric',month:'2-digit',day:'2-digit'});
    const p=fmt.formatToParts(new Date()).reduce((a,x)=>(a[x.type]=x.value,a),{});
    return {year:+p.year,month:+p.month,day:+p.day};
  }
  function updateTodayBadge(){
    try{
      const d=frame.contentDocument;if(!d)return;
      let badge=d.getElementById('todayBadge');
      if(!badge){const host=d.querySelector('.topbar > div:nth-child(2)')||d.querySelector('.mobileHeader > div:first-child');if(!host)return;badge=d.createElement('div');badge.id='todayBadge';host.appendChild(badge)}
      const t=todayInBangkok();badge.innerHTML=`Today <b>${String(t.day).padStart(2,'0')}/${String(t.month).padStart(2,'0')}/${t.year}</b> • Thailand (UTC+7)`;
    }catch(e){console.warn('Today badge update failed',e)}
  }
  const trainingNames={'IdF2':'Fire Fighting','IDF2':'Fire Fighting','IDP1':'IDP Training','IDP2':'IDP Training','IDP3':'IDP Training','IDP4':'IDP Training','IDP5':'IDP Training','IDP6':'IDP Training','IDP7':'IDP Training','IDP8':'IDP Training','IDP9':'IDP Training','IDP10':'IDP Training','IDP11':'IDP Training','IdF1':'Training','IDF1':'Training','IrF1':'Training','IrF2':'Training','PSM':'PSM Training','PSS':'PSS Training','DRO':'Training','CAM':'Training','5S':'5S Training','5s':'5S Training','SOP1':'SOP Training','SOP2':'SOP Training','IN1':'Training','IN2':'Training','IN3':'Training','BC1':'Training','BC2':'Training','BC3':'Training','BC4':'Training','BC5':'Training','BC6':'Training','OM1':'Training','OM2':'Training','Md1':'Training','Md2':'Training','Md3':'Training','Md4':'Training','Md5':'Training','ScF1':'Training','ScF2':'Training'};
  function isTrainingCode(raw){const c=String(raw||'').trim(),u=c.toUpperCase();if(!c)return false;if(trainingNames[c]||trainingNames[u])return true;if(/^(IDP|IDF|IRF|SOP|IN|BC|SCF|MD|OM)\d*/i.test(c))return true;if(/fire\s*fighting|firefighting|อบรม|training|seminar|course/i.test(c))return true;return false}
  function trainingLabel(raw){const c=String(raw||'').trim(),u=c.toUpperCase();return trainingNames[c]||trainingNames[u]||(/fire\s*fighting|firefighting|อบรม/i.test(c)?c:'Training')}
  const codeGuide=[['D','Day','ทำงานกะกลางวัน'],['N','Night','ทำงานกะกลางคืน'],['X','OFF','หยุด / ไม่ปฏิบัติงาน'],['L','Leave','ลา'],['PH','Holiday','วันหยุด/วันหยุดนักขัตฤกษ์ตาม Excel'],['OT / D (สีเข้ม)','OT','ทำงาน OT'],['OT / N (สีเข้ม)','OT','ทำงาน OT'],['IDP1–IDP11','Training','Individual Development / Training ตาม Excel'],['IdF1 / IdF2 / IrF1 / IrF2','Training','Training / Fire Fighting ตาม Excel'],['PSM / PSS','Training','Training ตาม Excel'],['SOP1 / SOP2','Training','SOP Training'],['IN1–IN3 / BC1–BC6','Training','Training ตาม Excel'],['CAM / 5S / 5s','Training','Training ตาม Excel'],['OM1 / OM2 / Md1–Md5 / ScF1–ScF2','Training','Training ตาม Excel'],['D(T) / N(T)','Truck Day / Truck Night','Shift T / Truck Loading'],['Other codes','ตาม Excel','คงรหัสต้นฉบับไว้เมื่อไม่ใช่สถานะหลัก']];
  function addCodeGuide(d){
    if(d.getElementById('codeGuideBack'))return;
    const style=d.createElement('style');style.textContent=`
      :root{--bg:#e7ebf0;--line:#c7d0da;--text:#1f2933;--muted:#53606c;--panel:#ffffff;--accent:#4f6f91;--accent-soft:#dce6f0;--work:#b9dec4;--workt:#183f28;--night:#b8cee6;--nightt:#183b5d;--off:#d7dde3;--offt:#3e4852;--ot:#4d712f;--ott:#fff;--otn:#183c6a;--otnt:#fff;--train:#d4b8e9;--traint:#3f2454;--leave:#efbcbc;--leavet:#702727;--holiday:#f2d990;--holidayt:#5f4810;--other:#c3c7ed;--othert:#303765}
      body{background:var(--bg);color:var(--text)}.card,.monthCard,.modal,#codeGuideModal{border-color:#c2ccd6}.calendar{border-color:#bcc7d2}.day{background:#fff;border-color:#c7d0da}.day.empty{background:#e8edf2}.dow{background:#dde3e9;color:#344250;border-color:#c3ccd5;font-weight:700}.num{color:#263542}.weekend .num{color:#7b4141}.title,.monthTitle,.monthName,.brand{color:#17222d}.source,.small,.monthMeta{color:#53606c}.toolbar,.legend{background:#fff}.legend span{background:#eef2f5;border-color:#c7d0da;color:#33414d}.btn,.viewBtn,.menuBtn{border-color:#c3ccd5;color:#33414d}.viewBtn.active{background:#dce6f0;border-color:#afc2d5;color:#294b6d}.btn.primary{background:#4f6f91;border-color:#4f6f91}.badge{font-weight:650}.work{background:#b9dec4;color:#183f28}.night{background:#b8cee6;color:#183b5d}.off{background:#d7dde3;color:#3e4852}.ot{background:#4d712f;color:#fff}.nightOt{background:#183c6a;color:#fff}.train{background:#d4b8e9;color:#3f2454}.leave{background:#efbcbc;color:#702727}.holiday{background:#f2d990;color:#5f4810}.other{background:#c3c7ed;color:#303765}.daynote{color:#665a47}.today{box-shadow:inset 0 0 0 3px #4f6f91!important}.miniDay.today{box-shadow:inset 0 0 0 2px #4f6f91!important}
      #todayBadge{color:#33414d!important;background:#eef2f5!important;border-color:#c5ced8!important}#todayBadge b{color:#365a7c!important}
      #codeGuideBtn{border:1px solid #c3ccd5;background:#fff;color:#33414d;border-radius:9px;padding:8px 11px;cursor:pointer}#codeGuideBtn:hover{background:#e9eef3}
      #codeGuideBack{position:fixed;inset:0;background:rgba(20,30,40,.42);display:none;align-items:center;justify-content:center;padding:18px;z-index:100}#codeGuideModal{width:min(760px,100%);max-height:88vh;overflow:auto;background:#fff;border:1px solid #c2ccd6;border-radius:17px;box-shadow:0 20px 60px rgba(20,30,40,.3);padding:20px}#codeGuideHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}#codeGuideHead strong{font-size:19px;color:#17222d}#codeGuideClose{border:0;background:#e6ebef;color:#27333e;border-radius:9px;width:34px;height:34px;cursor:pointer;font-size:20px}#codeGuideTable{width:100%;border-collapse:collapse;font-size:12px}#codeGuideTable th,#codeGuideTable td{border-bottom:1px solid #d7dee5;padding:9px 8px;text-align:left;vertical-align:top}#codeGuideTable th{background:#e3e8ed;color:#33414d;font-size:11px;position:sticky;top:0}
      #calendarEdgeZone{position:fixed;left:0;top:0;width:18px;height:100vh;z-index:90;pointer-events:auto}@media(max-width:720px){#calendarEdgeZone{display:none}}.edgeHint{position:fixed;left:2px;top:50%;transform:translateY(-50%);z-index:89;width:4px;height:70px;border-radius:0 5px 5px 0;background:#4f6f91;opacity:.55;pointer-events:none}@media(max-width:720px){.edgeHint{display:none}}
      @media(max-width:720px){#codeGuideBack{align-items:flex-end;padding:0}#codeGuideModal{width:100%;max-height:92vh;border-radius:18px 18px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}#codeGuideTable{font-size:11px}#codeGuideTable th,#codeGuideTable td{padding:8px 6px}}
    `;d.head.appendChild(style);
    const topActions=d.querySelector('.topbar .actions');if(topActions){const b=d.createElement('button');b.id='codeGuideBtn';b.textContent='Code Guide';topActions.insertBefore(b,topActions.firstChild);b.onclick=()=>d.getElementById('codeGuideBack').style.display='flex'}
    const mobileActions=d.querySelector('.mobileHeaderActions');if(mobileActions){const b=d.createElement('button');b.id='codeGuideBtnMobile';b.setAttribute('aria-label','Code Guide');b.textContent='?';b.style.cssText='border:1px solid var(--line);background:#fff;color:#33414d;border-radius:9px;width:38px;height:38px;cursor:pointer';mobileActions.insertBefore(b,mobileActions.firstChild);b.onclick=()=>d.getElementById('codeGuideBack').style.display='flex'}
    const back=d.createElement('div');back.id='codeGuideBack';back.innerHTML=`<div id="codeGuideModal"><div id="codeGuideHead"><strong>Calendar Code Guide</strong><button id="codeGuideClose">×</button></div><div style="font-size:11px;color:#53606c;margin-bottom:10px">คำอธิบายยึดจากข้อมูลและรหัสที่ปรากฏใน Excel ของ Project นี้</div><table id="codeGuideTable"><thead><tr><th>รหัส / กลุ่ม</th><th>แสดงใน Calendar</th><th>ความหมาย</th></tr></thead><tbody>${codeGuide.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</tbody></table></div>`;d.body.appendChild(back);d.getElementById('codeGuideClose').onclick=()=>back.style.display='none';back.addEventListener('click',e=>{if(e.target===back)back.style.display='none'});
    const edge=d.createElement('div');edge.id='calendarEdgeZone';d.body.appendChild(edge);const hint=d.createElement('div');hint.className='edgeHint';d.body.appendChild(hint);const app=d.querySelector('.app'),sidebar=d.querySelector('.sidebar');if(app&&sidebar){let timer=null;function openEdge(){app.classList.add('sidebarOpen');sidebar.style.transform='translateX(0)'}function closeEdge(){app.classList.remove('sidebarOpen');sidebar.style.transform='translateX(-100%)'}edge.addEventListener('mouseenter',openEdge);sidebar.addEventListener('mouseenter',openEdge);sidebar.addEventListener('mouseleave',()=>{clearTimeout(timer);timer=setTimeout(closeEdge,120)});d.addEventListener('mousemove',e=>{if(e.clientX<=18){clearTimeout(timer);openEdge()}else if(e.clientX>270&&app.classList.contains('sidebarOpen')){clearTimeout(timer);timer=setTimeout(closeEdge,120)}})}}
  function apply(){try{const w=frame.contentWindow,d=frame.contentDocument;if(!d||!w||!w.render)return;if(!applied){const style=d.createElement('style');style.id='calendar-main-overrides';style.textContent=`
      .monthFoot{display:none!important}.source{font-size:11px}.train{font-weight:700}
      /* High-contrast calendar theme: stronger borders, darker text, clearer status badges */
      .calendar,.day,.dow{border-color:#c3ccd5!important}.day{background:#fff}.day.empty{background:#e8edf2!important}.dow{background:#dde3e9!important;color:#344250!important;font-weight:700}.num{color:#263542!important}.weekend .num{color:#7b4141!important}.badge{font-weight:700;letter-spacing:.05px}
      .work{background:#b9dec4!important;color:#183f28!important}.night{background:#b8cee6!important;color:#183b5d!important}.off{background:#d7dde3!important;color:#3e4852!important}.ot{background:#4d712f!important;color:#fff!important}.nightOt{background:#183c6a!important;color:#fff!important}.train{background:#d4b8e9!important;color:#3f2454!important}.leave{background:#efbcbc!important;color:#702727!important}.holiday{background:#f2d990!important;color:#5f4810!important}.other{background:#c3c7ed!important;color:#303765!important}.daynote{color:#665a47!important}.day.today{box-shadow:inset 0 0 0 3px #4f6f91!important}.miniDay.today{box-shadow:inset 0 0 0 2px #4f6f91!important}
      `;d.head.appendChild(style);w.getToday=todayInBangkok;w.classify=function(code){if(!code)return{label:'OFF',cls:'off',raw:'OFF'};const c=String(code).trim(),u=c.toUpperCase();if(u==='D')return{label:'Day',cls:'work',raw:c};if(u==='N')return{label:'Night',cls:'night',raw:c};if(u==='DOT')return{label:'Day OT',cls:'ot',raw:c};if(u==='NOT')return{label:'Night OT',cls:'nightOt',raw:c};if(u==='OT')return{label:'OT',cls:'ot',raw:c};if(isTrainingCode(c))return{label:`Training${trainingLabel(c)==='Training'?'':' • '+trainingLabel(c)}`,cls:'train',raw:c};if(u==='L')return{label:'Leave',cls:'leave',raw:c};if(u==='PH')return{label:'Holiday',cls:'holiday',raw:c};if(u==='X')return{label:'OFF',cls:'off',raw:c};if(u==='D(T)')return{label:'Truck Day',cls:'work',raw:c};if(u==='N(T)')return{label:'Truck Night',cls:'night',raw:c};return{label:c,cls:'other',raw:c}};w.renderLegend=function(){const items=[['work','Day'],['night','Night'],['off','OFF'],['train','Training'],['ot','OT']];const el=d.getElementById('legend');if(el)el.innerHTML=items.map(([c,l])=>`<span><i class="dotStatus" style="background:var(--${c})"></i>${l}</span>`).join('')};addCodeGuide(d);applied=true}w.render();updateTodayBadge()}catch(e){console.warn('Calendar UI enhancement failed',e)}}
  frame.addEventListener('load',apply);setInterval(()=>{apply();updateTodayBadge()},60000);
})();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
</body>
</html>
