<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#347451">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Shift Calendar</title>
<style>
:root{--shell-bg:#eef3f1;--panel:rgba(255,255,255,.92);--line:rgba(28,59,45,.13);--text:#14251d;--accent:#2f7a54;--radius:18px;--shadow:0 18px 48px rgba(28,59,45,.14)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--shell-bg);font-family:Inter,"Segoe UI","Noto Sans Thai",Arial,sans-serif;color:var(--text)}#calendarFrame{display:block;width:100%;height:100%;height:100dvh;border:0;background:var(--shell-bg)}#themeDock{position:fixed;right:16px;top:14px;z-index:9999;display:flex;align-items:flex-start;gap:8px}.dockBtn{width:42px;height:42px;border:1px solid var(--line);border-radius:15px;background:var(--panel);backdrop-filter:blur(16px);box-shadow:0 8px 25px rgba(25,50,38,.11);color:var(--text);font-size:17px;cursor:pointer;transition:.18s}.dockBtn:hover{transform:translateY(-2px)}#themePanel{display:none;width:300px;padding:10px;background:var(--panel);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}#themePanel.open{display:block}.themeHead{padding:7px 8px 10px}.themeHead b{display:block;font-size:14px}.themeHead span{font-size:10px;color:#748079}.themeGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.themeCard{border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.68);padding:11px;text-align:left;cursor:pointer;color:var(--text);transition:.18s}.themeCard:hover{transform:translateY(-2px)}.themeCard.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.themeIcon{font-size:20px}.themeName{font-size:12px;font-weight:800;margin-top:5px}.themeDesc{font-size:9px;color:#748079;margin-top:2px}@media(max-width:720px){#themeDock{right:10px;top:9px}#themePanel{width:278px}.dockBtn{width:39px;height:39px;border-radius:13px}}
</style>
</head>
<body>
<iframe id="calendarFrame" src="./calendar.html?v=modern-20260820" title="Shift Calendar"></iframe>
<div id="themeDock">
 <button class="dockBtn" id="themeBtn" aria-label="เปิดคลัง Theme">◐</button>
 <div id="themePanel"><div class="themeHead"><b>Theme Library</b><span>เลือกบรรยากาศของ Shift Calendar</span></div><div class="themeGrid">
  <button class="themeCard" data-theme="white"><div class="themeIcon">☀</div><div class="themeName">White</div><div class="themeDesc">Clean • Minimal</div></button>
  <button class="themeCard" data-theme="black"><div class="themeIcon">●</div><div class="themeName">Black</div><div class="themeDesc">Deep • Focus</div></button>
  <button class="themeCard" data-theme="gray"><div class="themeIcon">◐</div><div class="themeName">Gray</div><div class="themeDesc">Slate • Professional</div></button>
  <button class="themeCard" data-theme="green"><div class="themeIcon">◉</div><div class="themeName">Green Flow</div><div class="themeDesc">Mint → Deep Green</div></button>
 </div></div>
</div>
<script>
(()=>{const frame=document.getElementById('calendarFrame'),btn=document.getElementById('themeBtn'),panel=document.getElementById('themePanel'),KEY='shiftCalendarModernTheme';let current=localStorage.getItem(KEY)||'white';
const themes={white:{bg:'#eef3f1',panel:'rgba(255,255,255,.92)',panel2:'#f4f8f6',line:'rgba(30,63,49,.12)',text:'#14251d',muted:'#708078',accent:'#2f7a54',soft:'#e1f0e8',day:'#fff',empty:'#edf2ef',dow:'#f1f6f3'},black:{bg:'#0c1110',panel:'#151b18',panel2:'#1d2622',line:'#314039',text:'#f1f7f3',muted:'#9eaea5',accent:'#59c98b',soft:'#193d2b',day:'#151b18',empty:'#101512',dow:'#1b231f'},gray:{bg:'#e6eaed',panel:'#f8f9fa',panel2:'#eef1f3',line:'#cbd2d7',text:'#273139',muted:'#68747c',accent:'#536878',soft:'#dce5ea',day:'#fff',empty:'#e9edef',dow:'#f0f2f4'},green:{bg:'#dcefe5',panel:'#f8fcfa',panel2:'#e5f2e9',line:'#c4ddce',text:'#17372a',muted:'#5d786b',accent:'#26724d',soft:'#d9eee1',day:'#fff',empty:'#e6f1eb',dow:'#e8f3ec'}};
function vars(t){let x=themes[t]||themes.white;return `:root{--modern-bg:${x.bg};--modern-panel:${x.panel};--modern-panel-2:${x.panel2};--modern-line:${x.line};--modern-text:${x.text};--modern-muted:${x.muted};--modern-accent:${x.accent};--modern-soft:${x.soft};--modern-day:${x.day};--modern-empty:${x.empty};--modern-dow:${x.dow}}`;}
function inject(){let d=frame.contentDocument;if(!d)return;d.documentElement.dataset.modernTheme=current;let s=d.getElementById('liveModernThemeVars');if(!s){s=d.createElement('style');s.id='liveModernThemeVars';d.head.appendChild(s)}s.textContent=vars(current);let l=d.getElementById('modernRedesignCss');if(!l){l=d.createElement('link');l.id='modernRedesignCss';l.rel='stylesheet';l.href='./redesign-modern.css?v=20260820';d.head.appendChild(l)}}
function mark(){document.querySelectorAll('.themeCard').forEach(c=>c.classList.toggle('active',c.dataset.theme===current))}function apply(t){current=t;localStorage.setItem(KEY,t);inject();mark()}btn.onclick=()=>panel.classList.toggle('open');document.addEventListener('click',e=>{if(!document.getElementById('themeDock').contains(e.target))panel.classList.remove('open')});document.querySelectorAll('.themeCard').forEach(c=>c.onclick=()=>{apply(c.dataset.theme);panel.classList.remove('open')});frame.addEventListener('load',()=>{inject();setTimeout(inject,200);setTimeout(inject,800)});mark();if('serviceWorker'in navigator)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.update())).catch(()=>{});})();
</script>
</body>
</html>
