name: Sync Shift Calendar from SharePoint

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sync-agent/package.json
      - run: npm install --prefix sync-agent
      - name: Sync workbook when changed
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          SP_SITE_ID: ${{ secrets.SP_SITE_ID }}
          SP_DRIVE_ID: ${{ secrets.SP_DRIVE_ID }}
          SP_ITEM_ID: ${{ secrets.SP_ITEM_ID }}
        run: node sync-agent/sync.js
      - name: Commit updated schedule
        run: |
          git config user.name 'shift-calendar-sync[bot]'
          git config user.email 'shift-calendar-sync[bot]@users.noreply.github.com'
          git add data/schedule.json data/metadata.json
          if git diff --cached --quiet; then
            echo 'No data changes to commit'
          else
            git commit -m 'sync: update shift schedule from SharePoint'
            git push
          fi
