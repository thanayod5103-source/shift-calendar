name: Apply Shift Calendar UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply Calendar requirements
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess, sys

          msg=subprocess.check_output(['git','log','-1','--pretty=%B'],text=True).strip()
          if '[calendar-ui-patch]' in msg:
              print('Patch commit detected; no second patch required.')
              sys.exit(0)

          p = Path('calendar.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              'function localDateParts(date=new Date()){return {year:date.getFullYear(),month:date.getMonth()+1,day:date.getDate()}}\nfunction getToday(){return localDateParts()}\nfunction scheduleNextTodayRefresh(){const now=new Date(), next=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1,0,0,2);setTimeout(()=>{render();scheduleNextTodayRefresh()}, Math.max(1000,next-now));}',
              '''const TODAY_ZONE="Asia/Bangkok";
const TODAY_FORMATTER=new Intl.DateTimeFormat("en-CA",{timeZone:TODAY_ZONE,calendar:"gregory",year:"numeric",month:"2-digit",day:"2-digit"});
function getToday(date=new Date()){
  const parts=TODAY_FORMATTER.formatToParts(date).reduce((a,p)=>(a[p.type]=p.value,a),{});
  return {year:Number(parts.year),month:Number(parts.month),day:Number(parts.day)};
}
function scheduleNextTodayRefresh(){
  const now=new Date(), t=getToday(now);
  let next=new Date(now.getTime()+1000);
  for(let i=1;i<=48;i++){
    const candidate=new Date(now.getTime()+i*60*60*1000);
    const ct=getToday(candidate);
    if(ct.year!==t.year||ct.month!==t.month||ct.day!==t.day){next=candidate;break;}
  }
  setTimeout(()=>{render();scheduleNextTodayRefresh()},Math.max(1000,next-now));
}'''
          )

          s = re.sub(r'const statusMap=\{.*?\};\nconst trainingCodes=', '''const statusMap={
 D:{label:"Day",cls:"work"},
 N:{label:"Night",cls:"night"},
 DOT:{label:"Day OT",cls:"ot"},
 NOT:{label:"Night OT",cls:"nightOt"},
 OT:{label:"OT",cls:"ot"},
 OFF:{label:"OFF",cls:"off"},
 TRAIN:{label:"Training",cls:"train"}
};
const trainingCodes=''', s, count=1, flags=re.S)

          s = re.sub(r'function classify\(code\)\{.*?\n\}', '''function classify(code){
  if(!code)return {label:"OFF",cls:"off",raw:"OFF"};
  const c=String(code).trim(), u=c.toUpperCase();
  if(statusMap[c])return {...statusMap[c],raw:c};
  if(u==="D")return {label:"Day",cls:"work",raw:c};
  if(u==="N")return {label:"Night",cls:"night",raw:c};
  if(trainingCodes.has(c)||/train|seminar|course|training/i.test(c))return {label:"Training",cls:"train",raw:c};
  if(u==="DOT")return {label:"Day OT",cls:"ot",raw:c};
  if(u==="NOT")return {label:"Night OT",cls:"nightOt",raw:c};
  if(u==="OT")return {label:"OT",cls:"ot",raw:c};
  return {label:"OFF",cls:"off",raw:c};
}''', s, count=1, flags=re.S)

          s = re.sub(r'function renderLegend\(\)\{.*?\n\}', '''function renderLegend(){
  const items=[["work","Day"],["night","Night"],["off","OFF"],["train","Training"],["ot","OT"]];
  document.getElementById("legend").innerHTML=items.map(([c,l])=>`<span><i class="dotStatus" style="background:var(--${c})"></i>${l}</span>`).join("");
}''', s, count=1, flags=re.S)

          s = re.sub(r'const p=people\(currentMonth\), counts=\{Work:0,Night:0,OT:0,Training:0,OFF:0,Other:0\};.*?document\.getElementById\("roster"\)\.innerHTML=', '''const p=people(currentMonth), counts={Day:0,Night:0,OT:0,Training:0,OFF:0};
  p.forEach(person=>{for(let d=1;d<=data.months[currentMonth].days;d++){
    const s=classify(codeFor(currentMonth,person,d));
    if(s.label==="Day")counts.Day++;
    else if(s.label==="Night")counts.Night++;
    else if(s.label==="Day OT"||s.label==="Night OT"||s.label==="OT")counts.OT++;
    else if(s.label==="Training")counts.Training++;
    else counts.OFF++;
  }});
  document.getElementById("stats").innerHTML=Object.entries(counts).map(([a,b])=>`<div class="stat"><b>${b}</b><span>${a}</span></div>`).join("");
  document.getElementById("roster").innerHTML=''', s, count=1, flags=re.S)

          s = re.sub(r'<option value="">ใช้ข้อมูลจาก Excel</option>.*?</select>', '''<option value="">ใช้ข้อมูลจาก Excel</option>
        <option value="D">Day</option><option value="N">Night</option>
        <option value="OT">OT</option><option value="TRAIN">Training</option>
        <option value="OFF">OFF</option>
      </select>''', s, count=1, flags=re.S)

          s = s.replace('.toolbar{padding:13px 15px;', '.toolbar{padding:10px 12px;')
          s = s.replace('.legend{display:flex;flex-wrap:wrap;gap:7px;', '.legend{display:flex;flex-wrap:wrap;gap:6px;')
          s = s.replace('PTT LNG • LMPT1 • V1.2 • Shift T', 'PTT LNG • LMPT1')
          s = s.replace('PTT LNG • LMPT1 • V1.2', 'PTT LNG • LMPT1')
          s = s.replace('Shift Calendar 2026 — PWA V2 Mobile', 'Shift Calendar')

          p.write_text(s, encoding='utf-8')

      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('calendar.html').read_text(encoding='utf-8')
          js=re.search(r'<script>(.*?)</script>',s,re.S).group(1)
          Path('/tmp/calendar.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/calendar.js

      - name: Commit patched Calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar.html
          if git diff --cached --quiet; then
            echo "No Calendar changes required."
            exit 0
          fi
          git commit -m "Apply Shift Calendar requirements [calendar-ui-patch]"
          git push
